[project]
name = "sentinel-c2"
version = "0.1.0"
description = "Silent Sentinel C2: collection point between the ESP32 acoustic nodes and the Visual-Trackers"
requires-python = ">=3.10"
dependencies = ["silent-sentinel @ git+https://github.com/H4D-Silent-Sentinel/silent-sentinel.git"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sentinel-c2 = "sentinel_c2.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_c2*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
