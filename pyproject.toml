[project]
name = "roaree"
version = "0.1.0"
description = "ROAREE (Remote Observation, Autonomous Recognition, and Event Evaluation): Silent Sentinel C2"
requires-python = ">=3.10"
dependencies = ["sentinel @ git+https://github.com/H4D-Silent-Sentinel/sentinel.git"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
roaree = "sentinel_c2.__main__:main"
sentinel-c2 = "sentinel_c2.__main__:main"  # old command name, kept

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_c2*"]

[tool.setuptools.package-data]
sentinel_c2 = ["static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
faulthandler_timeout = 30  # a hung test prints where it is stuck
